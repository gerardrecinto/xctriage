name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# Repository/organization Variables (Settings > Secrets and variables >
# Actions > Variables) override the `vars.X || default` fallbacks below
# without touching this file. Action version pins (@v4, @v0.36.0, ...) are
# NOT made overridable this way on purpose: letting a variable silently
# swap which action code runs would defeat the point of pinning a
# supply-chain dependency.
env:
  CI_SOURCE: xcodebuild
  XCTRIAGE_BIN: .build/release/xctriage
  BUILD_LOG: build.log
  TEST_LOG: test.log
  REMEDIATION_JSON: remediation_triage.json
  REMEDIATION_DIFF: remediation_proposal.diff
  TRIVY_RESULTS_SARIF: trivy-results.sarif

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  trivy:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (deps + misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: ${{ vars.TRIVY_SCANNERS || 'vuln,secret,misconfig' }}
          skip-dirs: ${{ vars.TRIVY_SKIP_DIRS || '.build' }}
          format: sarif
          output: ${{ env.TRIVY_RESULTS_SARIF }}
          severity: ${{ vars.TRIVY_SEVERITY || 'CRITICAL,HIGH' }}

      - name: Upload Trivy results to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ env.TRIVY_RESULTS_SARIF }}

  test:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    # Job-level override (top-level default is contents: read) so the
    # Auto-Remediate PR step can push a remediation branch and open a draft
    # PR via `gh`. On a fork's pull_request run GITHUB_TOKEN stays read-only
    # regardless of what's declared here (GitHub security default) - that
    # step's continue-on-error already tolerates that failure the same way
    # it tolerates a policy rejection.
    permissions:
      contents: write
      packages: write
      pull-requests: write
    strategy:
      matrix:
        xcode: ${{ fromJSON(vars.XCODE_VERSIONS || '["16.3"]') }}
    env:
      # Same policy as the Jenkins pipeline's Auto-Remediate stage: the LLM
      # only picks the failure category, never the remediation action. Only
      # a flaky_test verdict at this confidence or higher gets one automatic
      # retry. Secrets are optional here on purpose: a fork without them
      # configured just skips the LLM step and fails normally on a real
      # test failure, instead of the workflow erroring out.
      FLAKY_CONFIDENCE_THRESHOLD: ${{ vars.FLAKY_CONFIDENCE_THRESHOLD || '0.75' }}
      XCTRIAGE_ANTHROPIC_API_KEY: ${{ secrets.XCTRIAGE_ANTHROPIC_API_KEY }}
      XCTRIAGE_SLACK_WEBHOOK: ${{ secrets.XCTRIAGE_SLACK_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --quiet

      - name: Build
        id: build
        run: swift build -c release 2>&1 | tee "$BUILD_LOG"

      - name: "Self-triage: build failure"
        if: failure() && steps.build.outcome == 'failure'
        run: |
          "$XCTRIAGE_BIN" analyze "$BUILD_LOG" \
            --source "$CI_SOURCE" \
            --build-id "${{ github.run_id }}" \
            --llm \
            --output slack || true

      - name: Test
        id: test
        continue-on-error: true
        run: swift test 2>&1 | tee "$TEST_LOG"

      - name: "Auto-Remediate: classify failure"
        id: classify
        if: steps.test.outcome == 'failure'
        run: |
          "$XCTRIAGE_BIN" analyze "$TEST_LOG" \
            --source "$CI_SOURCE" \
            --build-id "${{ github.run_id }}" \
            --llm \
            --output json > "$REMEDIATION_JSON" || true
          category=$(python3 -c "import json,os; print(json.load(open(os.environ['REMEDIATION_JSON']))['classification']['category'])" 2>/dev/null || echo unknown)
          confidence=$(python3 -c "import json,os; print(json.load(open(os.environ['REMEDIATION_JSON']))['classification']['confidence'])" 2>/dev/null || echo 0)
          echo "category=$category" >> "$GITHUB_OUTPUT"
          echo "confidence=$confidence" >> "$GITHUB_OUTPUT"
          echo "LLM classification: $category (confidence $confidence, threshold $FLAKY_CONFIDENCE_THRESHOLD)"

      - name: "Auto-Remediate: retry flaky test"
        id: retry
        if: >
          steps.test.outcome == 'failure' &&
          steps.classify.outputs.category == 'flaky_test' &&
          fromJSON(steps.classify.outputs.confidence) >= fromJSON(env.FLAKY_CONFIDENCE_THRESHOLD)
        run: swift test 2>&1 | tee "$TEST_LOG"

      # The one other category RemediationPolicy allows a patch attempt for.
      # `xctriage remediate` fingerprints the failure, re-runs it through the
      # same policy gate, asks Claude for a single-file diff, and proves it
      # by building and testing inside an isolated git worktree before this
      # step ever sees output. When it also passes sandbox validation this
      # opens a draft PR (GitHubPRWriter, never auto-merged - a human still
      # has to approve it). --create-pr is left off entirely on a fork's
      # pull_request run, where GITHUB_TOKEN can't push to this repo anyway;
      # skipping it there avoids a guaranteed-to-fail push instead of just
      # tolerating it. continue-on-error because a non-zero exit here means
      # policy or the sandbox rejected the proposal (wrong category, too
      # many files touched, forbidden path, build/test still red) - that's
      # the gate working, not a workflow failure, so the job still falls
      # through to the Slack notification either way.
      - name: "Auto-Remediate: propose sandboxed patch, open draft PR (compilation_error)"
        id: propose_patch
        if: >
          steps.test.outcome == 'failure' &&
          steps.retry.outcome != 'success' &&
          steps.classify.outputs.category == 'compilation_error'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CREATE_PR_FLAG=""
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]; then
            CREATE_PR_FLAG="--create-pr"
          fi

          "$XCTRIAGE_BIN" remediate "$TEST_LOG" \
            --source "$CI_SOURCE" \
            --repo-root . \
            --out "$REMEDIATION_DIFF" \
            $CREATE_PR_FLAG

      - name: Upload remediation proposal
        if: steps.propose_patch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: remediation-proposal-${{ matrix.xcode }}
          path: ${{ env.REMEDIATION_DIFF }}

      - name: "Auto-Remediate: notify (no safe auto-fix)"
        if: steps.test.outcome == 'failure' && steps.retry.outcome != 'success'
        run: |
          "$XCTRIAGE_BIN" analyze "$TEST_LOG" \
            --source "$CI_SOURCE" \
            --build-id "${{ github.run_id }}" \
            --llm \
            --output slack || true

      - name: Fail job if the test failure was not auto-remediated
        if: steps.test.outcome == 'failure' && steps.retry.outcome != 'success'
        run: exit 1

      - name: "Self-triage: analyze build output"
        run: |
          "$XCTRIAGE_BIN" analyze "$BUILD_LOG" \
            --source "$CI_SOURCE" \
            --build-id "${{ github.run_id }}" \
            --output json | python3 -m json.tool

      - name: "Self-triage: analyze test output"
        run: |
          "$XCTRIAGE_BIN" analyze "$TEST_LOG" \
            --source "$CI_SOURCE" \
            --build-id "${{ github.run_id }}" \
            --output json | python3 -m json.tool

      - name: Upload triage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-reports-${{ matrix.xcode }}
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.TEST_LOG }}
            ${{ env.REMEDIATION_JSON }}
