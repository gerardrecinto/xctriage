name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (deps + misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: .build
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  test:
    runs-on: macos-15
    strategy:
      matrix:
        xcode: ["16.3"]
    env:
      # Same policy as the Jenkins pipeline's Auto-Remediate stage: the LLM
      # only picks the failure category, never the remediation action. Only
      # a flaky_test verdict at this confidence or higher gets one automatic
      # retry. Secrets are optional here on purpose: a fork without them
      # configured just skips the LLM step and fails normally on a real
      # test failure, instead of the workflow erroring out.
      FLAKY_CONFIDENCE_THRESHOLD: '0.75'
      XCTRIAGE_ANTHROPIC_API_KEY: ${{ secrets.XCTRIAGE_ANTHROPIC_API_KEY }}
      XCTRIAGE_SLACK_WEBHOOK: ${{ secrets.XCTRIAGE_SLACK_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --quiet

      - name: Build
        id: build
        run: swift build -c release 2>&1 | tee build.log

      - name: "Self-triage: build failure"
        if: failure() && steps.build.outcome == 'failure'
        run: |
          .build/release/xctriage analyze build.log \
            --source xcodebuild \
            --build-id "${{ github.run_id }}" \
            --llm \
            --output slack || true

      - name: Test
        id: test
        continue-on-error: true
        run: swift test 2>&1 | tee test.log

      - name: "Auto-Remediate: classify failure"
        id: classify
        if: steps.test.outcome == 'failure'
        run: |
          .build/release/xctriage analyze test.log \
            --source xcodebuild \
            --build-id "${{ github.run_id }}" \
            --llm \
            --output json > remediation_triage.json || true
          category=$(python3 -c "import json; print(json.load(open('remediation_triage.json'))['classification']['category'])" 2>/dev/null || echo unknown)
          confidence=$(python3 -c "import json; print(json.load(open('remediation_triage.json'))['classification']['confidence'])" 2>/dev/null || echo 0)
          echo "category=$category" >> "$GITHUB_OUTPUT"
          echo "confidence=$confidence" >> "$GITHUB_OUTPUT"
          echo "LLM classification: $category (confidence $confidence, threshold $FLAKY_CONFIDENCE_THRESHOLD)"

      - name: "Auto-Remediate: retry flaky test"
        id: retry
        if: >
          steps.test.outcome == 'failure' &&
          steps.classify.outputs.category == 'flaky_test' &&
          fromJSON(steps.classify.outputs.confidence) >= fromJSON(env.FLAKY_CONFIDENCE_THRESHOLD)
        run: swift test 2>&1 | tee test.log

      - name: "Auto-Remediate: notify (no safe auto-fix)"
        if: steps.test.outcome == 'failure' && steps.retry.outcome != 'success'
        run: |
          .build/release/xctriage analyze test.log \
            --source xcodebuild \
            --build-id "${{ github.run_id }}" \
            --llm \
            --output slack || true

      - name: Fail job if the test failure was not auto-remediated
        if: steps.test.outcome == 'failure' && steps.retry.outcome != 'success'
        run: exit 1

      - name: "Self-triage: analyze build output"
        run: |
          .build/release/xctriage analyze build.log \
            --source xcodebuild \
            --build-id "${{ github.run_id }}" \
            --output json | python3 -m json.tool

      - name: "Self-triage: analyze test output"
        run: |
          .build/release/xctriage analyze test.log \
            --source xcodebuild \
            --build-id "${{ github.run_id }}" \
            --output json | python3 -m json.tool

      - name: Upload triage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-reports-${{ matrix.xcode }}
          path: |
            build.log
            test.log
            remediation_triage.json
