name: Claude PR Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# Same override convention as ci.yml: repo/org Variables (Settings > Secrets
# and variables > Actions > Variables) override these without touching this
# file. Action version pins stay hardcoded on purpose (see ci.yml's own note).
env:
  DIFF_FILE: pr.diff
  REVIEW_FILE: pr_review.md

jobs:
  review:
    # ubuntu-latest today; point vars.LINUX_RUNNER at an Actions Runner
    # Controller runner-scale-set label once one exists (see
    # docs/architecture/TARGET_ARC_AND_ARGOCD_DESIGN.md), this job is pure
    # Python + `gh`, no Xcode/macOS dependency, so it's ARC-eligible as-is.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Compute PR diff
        run: |
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            -- '*.swift' 'Package.swift' > "$DIFF_FILE"
          echo "diff: $(wc -l < "$DIFF_FILE") lines"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install review script dependencies
        run: pip install --quiet anthropic pydantic

      # Secrets are optional on purpose, same as ci.yml's Auto-Remediate step:
      # a fork's pull_request run has no repo secrets, so the review skips
      # instead of failing the job. The secret is read in this one step and
      # exposed to later steps only as a true/false output, because a step
      # `if:` cannot see a variable that is set inside the step it guards.
      - name: Check for API key
        id: key
        env:
          XCTRIAGE_ANTHROPIC_API_KEY: ${{ secrets.XCTRIAGE_ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$XCTRIAGE_ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Claude PR review skipped: XCTRIAGE_ANTHROPIC_API_KEY is not available (not set, or this is a fork PR)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # --post is left off on a fork PR, where GITHUB_TOKEN can't comment on
      # this repo anyway.
      - name: Claude PR review
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.XCTRIAGE_ANTHROPIC_API_KEY }}
          XCTRIAGE_ANTHROPIC_API_KEY: ${{ secrets.XCTRIAGE_ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          POST_FLAG=""
          if [ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]; then
            POST_FLAG="--post"
          fi
          python3 .github/scripts/pr_reviewer.py \
            --diff-file "$DIFF_FILE" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --commit-sha "${{ github.event.pull_request.head.sha }}" \
            --output "$REVIEW_FILE" \
            $POST_FLAG

      - name: Upload review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-pr-review
          path: |
            ${{ env.DIFF_FILE }}
            ${{ env.REVIEW_FILE }}
          if-no-files-found: ignore
