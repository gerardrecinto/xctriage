name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  XCTRIAGE_BIN: xctriage
  RELEASE_ASSET: xctriage-macos.zip

jobs:
  release:
    name: Build macOS binary
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build release binary
        run: swift build -c release

      - name: Package binary
        run: |
          cp ".build/release/$XCTRIAGE_BIN" "./$XCTRIAGE_BIN"
          zip "$RELEASE_ASSET" "$XCTRIAGE_BIN"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: ${{ env.RELEASE_ASSET }}
