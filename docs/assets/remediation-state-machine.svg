<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'SF Mono', Menlo, Consolas, monospace">
  <title>xctriage remediation state machine (RemediationStateMachine.swift, MEASURED — this diagram matches the real code, not a target design)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1000" height="460" fill="#ffffff"/>

  <!-- start marker -->
  <circle cx="40" cy="80" r="8" fill="#111827"/>
  <text x="40" y="105" font-size="11" text-anchor="middle" fill="#374151">start</text>

  <!-- patchProposed -->
  <rect x="90" y="55" width="150" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="85" font-size="13" text-anchor="middle" fill="#1e3a8a">patchProposed</text>

  <!-- validating -->
  <rect x="300" y="55" width="130" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="365" y="85" font-size="13" text-anchor="middle" fill="#1e3a8a">validating</text>

  <!-- sandboxPassed -->
  <rect x="490" y="55" width="150" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="85" font-size="13" text-anchor="middle" fill="#1e3a8a">sandboxPassed</text>

  <!-- prOpened (terminal, success) -->
  <rect x="700" y="55" width="130" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="765" y="85" font-size="13" text-anchor="middle" fill="#14532d">prOpened</text>
  <text x="765" y="120" font-size="10" text-anchor="middle" fill="#4b5563">terminal · success</text>

  <!-- prFailed (terminal) -->
  <rect x="700" y="170" width="130" height="50" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
  <text x="765" y="200" font-size="13" text-anchor="middle" fill="#7f1d1d">prFailed</text>
  <text x="765" y="235" font-size="10" text-anchor="middle" fill="#4b5563">terminal · gh/git error</text>

  <!-- sandboxFailed (terminal) -->
  <rect x="300" y="170" width="130" height="50" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
  <text x="365" y="200" font-size="13" text-anchor="middle" fill="#7f1d1d">sandboxFailed</text>
  <text x="365" y="235" font-size="10" text-anchor="middle" fill="#4b5563">terminal · build/test failed</text>

  <!-- policyRejected (terminal, reachable from start or patchProposed) -->
  <rect x="90" y="290" width="150" height="50" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
  <text x="165" y="320" font-size="13" text-anchor="middle" fill="#7c2d12">policyRejected</text>
  <text x="165" y="355" font-size="10" text-anchor="middle" fill="#4b5563">terminal · deterministic gate</text>

  <!-- arrows: main chain -->
  <line x1="48" y1="80" x2="88" y2="80" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="80" x2="298" y2="80" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="80" x2="488" y2="80" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="80" x2="698" y2="80" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- validating -> sandboxFailed -->
  <line x1="365" y1="105" x2="365" y2="168" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- sandboxPassed -> prFailed -->
  <line x1="590" y1="105" x2="740" y2="168" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- patchProposed -> policyRejected -->
  <line x1="150" y1="105" x2="155" y2="288" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- start -> policyRejected (dashed, pre-generation rejection) -->
  <path d="M 40 88 C 40 250, 90 300, 90 315" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <text x="50" y="240" font-size="10" fill="#92400e">no patch generated —</text>
  <text x="50" y="253" font-size="10" fill="#92400e">category/confidence/attempt gate</text>

  <!-- re-apply same state = no-op note -->
  <path d="M 165 55 C 200 30, 130 30, 165 53" fill="none" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="165" y="20" font-size="10" text-anchor="middle" fill="#6b7280">re-applying current state = no-op, not an error</text>

  <!-- legend -->
  <g transform="translate(90,395)">
    <rect x="0" y="0" width="16" height="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="22" y="13" font-size="11" fill="#374151">in-flight state</text>

    <rect x="160" y="0" width="16" height="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="182" y="13" font-size="11" fill="#374151">terminal · success</text>

    <rect x="340" y="0" width="16" height="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="362" y="13" font-size="11" fill="#374151">terminal · failure</text>

    <rect x="500" y="0" width="16" height="16" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="522" y="13" font-size="11" fill="#374151">terminal · policy-rejected</text>
  </g>
  <text x="90" y="435" font-size="10" fill="#6b7280">Every transition is a persisted SQLite row (RemediationStateMachine.swift). Illegal jumps throw TransitionError; a crashed/restarted process recovers from the last row.</text>
</svg>
