<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" font-family="'SF Mono', Menlo, Consolas, monospace">
  <title>Trust boundaries in the xctriage remediation path (MEASURED — matches RemediationPolicy, SandboxValidator, GitHubPRWriter as written)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="720" height="900" fill="#ffffff"/>

  <!-- UNTRUSTED zone -->
  <rect x="40" y="40" width="640" height="90" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="60" y="65" font-size="12" fill="#7f1d1d" font-weight="bold">UNTRUSTED INPUT</text>
  <text x="60" y="88" font-size="11" fill="#7f1d1d">build logs / .xcresult contents / failing file contents — attacker-influenceable</text>
  <text x="60" y="108" font-size="11" fill="#7f1d1d">(a malicious test name or error string is exactly the prompt-injection surface here)</text>

  <line x1="360" y1="130" x2="360" y2="163" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- LLM zone (purple) -->
  <rect x="180" y="165" width="360" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="192" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="bold">PatchGenerator (Claude)</text>
  <text x="360" y="212" font-size="10" text-anchor="middle" fill="#4c1d95">proposes a unified diff — output is still untrusted text, not code with authority</text>

  <line x1="360" y1="235" x2="360" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="375" y="255" font-size="10" fill="#6b7280">PatchProposal (data, not executed yet)</text>

  <!-- boundary line -->
  <line x1="20" y1="255" x2="700" y2="255" stroke="#111827" stroke-width="2" stroke-dasharray="2,4"/>
  <text x="30" y="248" font-size="10" fill="#111827">— trust boundary: nothing above this line has any authority —</text>

  <!-- DETERMINISTIC POLICY GATE (blue) -->
  <rect x="120" y="270" width="480" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="296" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="bold">RemediationPolicy — deterministic, no LLM call (ADR-002)</text>
  <text x="360" y="316" font-size="10" text-anchor="middle" fill="#1e3a8a">isEligibleForRemediation: category allowlist, confidence floor, attempt limit</text>
  <text x="360" y="333" font-size="10" text-anchor="middle" fill="#1e3a8a">isPatchAllowed: ≤1 file, forbidden paths (its own source, .github/, Package.swift)</text>

  <polygon points="360,365 400,390 360,415 320,390" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="394" font-size="10" text-anchor="middle" fill="#7c2d12">allowed?</text>
  <rect x="440" y="375" width="150" height="30" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="515" y="395" font-size="10" text-anchor="middle" fill="#7f1d1d">denied → stop, no PR</text>
  <line x1="400" y1="390" x2="438" y2="390" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="415" x2="360" y2="448" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="368" y="435" font-size="9" fill="#4b5563">allowed</text>

  <!-- SANDBOX (blue, isolated) -->
  <rect x="120" y="450" width="480" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="476" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="bold">SandboxValidator — disposable git worktree (ADR-004)</text>
  <text x="360" y="496" font-size="10" text-anchor="middle" fill="#1e3a8a">never touches the real working tree · applies diff, swift build, swift test</text>
  <text x="360" y="513" font-size="10" text-anchor="middle" fill="#1e3a8a">timed out / killed if hung (docs/runbooks/sandbox-hang.md)</text>
  <text x="360" y="530" font-size="10" text-anchor="middle" fill="#1e3a8a">worktree destroyed unconditionally after, pass or fail</text>

  <polygon points="360,560 400,585 360,610 320,585" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="589" font-size="10" text-anchor="middle" fill="#7c2d12">passed?</text>
  <rect x="440" y="570" width="150" height="30" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="515" y="590" font-size="10" text-anchor="middle" fill="#7f1d1d">failed → stop, no PR</text>
  <line x1="400" y1="585" x2="438" y2="585" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="610" x2="360" y2="643" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="368" y="630" font-size="9" fill="#166534">passed</text>

  <!-- DRAFT PR (green) -->
  <rect x="150" y="645" width="420" height="65" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="360" y="670" font-size="12" text-anchor="middle" fill="#14532d" font-weight="bold">GitHubPRWriter — draft PR only (ADR-003)</text>
  <text x="360" y="690" font-size="10" text-anchor="middle" fill="#14532d">no code path here can open a non-draft PR or call gh pr merge</text>

  <line x1="360" y1="710" x2="360" y2="743" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- boundary line 2 -->
  <line x1="20" y1="750" x2="700" y2="750" stroke="#111827" stroke-width="2" stroke-dasharray="2,4"/>
  <text x="30" y="743" font-size="10" fill="#111827">— trust boundary: only a human crosses into merge —</text>

  <!-- HUMAN APPROVAL (orange) -->
  <rect x="180" y="755" width="360" height="65" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
  <text x="360" y="782" font-size="12" text-anchor="middle" fill="#7c2d12" font-weight="bold">HUMAN reviews and merges the draft PR</text>
  <text x="360" y="802" font-size="10" text-anchor="middle" fill="#7c2d12">the only step in this diagram this codebase does not perform itself</text>

  <text x="360" y="855" font-size="10" text-anchor="middle" fill="#6b7280">Below the second boundary is out of scope for this codebase entirely — see</text>
  <text x="360" y="872" font-size="10" text-anchor="middle" fill="#6b7280">docs/architecture/WHAT_WE_DID_NOT_BUILD.md for what a merge would trigger in the target design.</text>
</svg>
