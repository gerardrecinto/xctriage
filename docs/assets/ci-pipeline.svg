<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="'SF Mono', Menlo, Consolas, monospace">
  <title>xctriage's own CI pipeline (.github/workflows/ci.yml, MEASURED — real step names, not a target design)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="900" height="760" fill="#ffffff"/>

  <text x="450" y="30" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold">test job (macos-15, matrix: Xcode 16.3)</text>

  <!-- linear steps -->
  <g font-size="12" fill="#1e3a8a">
    <rect x="330" y="45" width="240" height="34" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="450" y="67" text-anchor="middle">Select Xcode / swift --version</text>

    <rect x="330" y="95" width="240" height="34" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="450" y="117" text-anchor="middle">Resolve dependencies / Lint</text>

    <rect x="330" y="145" width="240" height="34" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="450" y="167" text-anchor="middle">Build (swift build -c release)</text>
  </g>

  <!-- build failure branch -->
  <rect x="620" y="145" width="230" height="34" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="735" y="167" font-size="11" text-anchor="middle" fill="#7f1d1d">Self-triage: build failure → exit</text>
  <line x1="570" y1="162" x2="618" y2="162" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ared)"/>
  <text x="595" y="150" font-size="9" fill="#7f1d1d">on failure</text>

  <g font-size="12" fill="#1e3a8a">
    <rect x="330" y="195" width="240" height="34" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="450" y="217" text-anchor="middle">Test (swift test)</text>

    <rect x="330" y="245" width="240" height="34" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="450" y="267" text-anchor="middle">Auto-Remediate: classify failure</text>
  </g>
  <text x="450" y="290" font-size="10" text-anchor="middle" fill="#6b7280">RuleClassifier first (deterministic); ClaudeClassifier only below 0.60 confidence</text>

  <!-- decision diamond -->
  <polygon points="450,310 540,355 450,400 360,355" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="350" font-size="11" text-anchor="middle" fill="#7c2d12">category?</text>
  <text x="450" y="365" font-size="9" text-anchor="middle" fill="#7c2d12">(deterministic gate,</text>
  <text x="450" y="376" font-size="9" text-anchor="middle" fill="#7c2d12">no LLM decides)</text>

  <line x1="450" y1="279" x2="450" y2="308" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- flaky branch -->
  <rect x="80" y="335" width="220" height="40" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="352" font-size="11" text-anchor="middle" fill="#1e3a8a">flaky_test:</text>
  <text x="190" y="366" font-size="11" text-anchor="middle" fill="#1e3a8a">retry once (swift test)</text>
  <line x1="360" y1="345" x2="302" y2="349" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="330" y="335" font-size="9" fill="#4b5563">flaky_test</text>

  <!-- compilation_error branch -->
  <rect x="600" y="335" width="260" height="55" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="355" font-size="11" text-anchor="middle" fill="#4c1d95">compilation_error:</text>
  <text x="730" y="370" font-size="11" text-anchor="middle" fill="#4c1d95">xctriage remediate --create-pr</text>
  <text x="730" y="383" font-size="9" text-anchor="middle" fill="#4c1d95">(policy → patch → sandbox → draft PR)</text>
  <line x1="540" y1="352" x2="598" y2="358" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="555" y="338" font-size="9" fill="#4b5563">compilation_error</text>

  <!-- other category -->
  <rect x="380" y="440" width="140" height="40" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="450" y="458" font-size="11" text-anchor="middle" fill="#7f1d1d">no safe auto-fix</text>
  <text x="450" y="472" font-size="10" text-anchor="middle" fill="#7f1d1d">notify → fail job</text>
  <line x1="450" y1="400" x2="450" y2="438" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ared)"/>
  <text x="460" y="418" font-size="9" fill="#7f1d1d">other category</text>

  <!-- draft PR outcome (green, terminal for CI's part) -->
  <rect x="640" y="440" width="180" height="45" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="460" font-size="11" text-anchor="middle" fill="#14532d">draft PR opened</text>
  <text x="730" y="474" font-size="9" text-anchor="middle" fill="#14532d">(human review required — ADR-003)</text>
  <line x1="730" y1="390" x2="730" y2="438" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="640" y="510" width="180" height="35" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="730" y="532" font-size="10" text-anchor="middle" fill="#1e3a8a">Upload remediation proposal</text>
  <line x1="730" y1="485" x2="730" y2="508" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- self-triage always runs -->
  <rect x="330" y="580" width="240" height="34" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="602" font-size="11" text-anchor="middle" fill="#1e3a8a">Self-triage: analyze build + test output</text>
  <rect x="330" y="625" width="240" height="34" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="647" font-size="11" text-anchor="middle" fill="#1e3a8a">Upload triage reports</text>

  <!-- parallel jobs -->
  <text x="120" y="45" font-size="13" fill="#111827" font-weight="bold">parallel jobs</text>
  <rect x="30" y="55" width="180" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="72" font-size="11" text-anchor="middle" fill="#374151">dependency-review</text>
  <text x="120" y="86" font-size="9" text-anchor="middle" fill="#6b7280">(on pull_request)</text>

  <rect x="30" y="105" width="180" height="55" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="125" font-size="11" text-anchor="middle" fill="#374151">trivy filesystem scan</text>
  <text x="120" y="140" font-size="9" text-anchor="middle" fill="#6b7280">vuln, secret, misconfig</text>
  <text x="120" y="153" font-size="9" text-anchor="middle" fill="#6b7280">→ Code Scanning (SARIF)</text>

  <text x="450" y="705" font-size="10" text-anchor="middle" fill="#6b7280">This is what runs on every push/PR to main today, read directly from .github/workflows/ci.yml — a Jenkinsfile mirrors the same Auto-Remediate policy for the on-prem pipeline.</text>
</svg>
